<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RASHIK - رشيق</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:\'Tajawal\',sans-serif;background:#FFF9F0}</style>
</head>
<body>
<div id="app"></div>
<script>
const FOODS = [
  {name:"صدر دجاج",cal:165,p:31,c:0,f:3.6,gi:0},
  {name:"أرز أبيض",cal:130,p:2.4,c:28,f:0.2,gi:72},
  {name:"بيض",cal:143,p:12.5,c:1.1,f:9.5,gi:0},
  {name:"شوفان",cal:389,p:16.9,c:66,f:6.9,gi:55},
  {name:"تونة",cal:116,p:25.5,c:0,f:0.8,gi:0},
  {name:"موز",cal:89,p:1.1,c:23,f:0.3,gi:51},
];
let profile = JSON.parse(localStorage.getItem(\'rashik_profile\')||\'null\');
let logs = JSON.parse(localStorage.getItem(\'rashik_logs\')||\'{"water":0,"steps":0,"meals":{"breakfast":[],"lunch":[],"dinner":[],"snacks":[]}}\');
let activeMeal = \'breakfast\';
const labels = {breakfast:\'الإفطار\', lunch:\'الغداء\', dinner:\'العشاء\', snacks:\'وجبات خفيفة\'};

function save(){ localStorage.setItem(\'rashik_logs\', JSON.stringify(logs)); render(); }
function getTargets(){
  if(!profile) return {cal:2200,p:150,c:250,f:70};
  let bmr = profile.gender===\'male\' ? 10*profile.weight+6.25*profile.height-5*profile.age+5 : 10*profile.weight+6.25*profile.height-5*profile.age-161;
  let tdee = bmr * profile.activity;
  let cal = profile.goal===\'deficit\'? tdee*0.8 : profile.goal===\'bulk\'? tdee*1.12 : tdee;
  let p = profile.weight * 2;
  let f = (cal*0.25)/9;
  let c = (cal - p*4 - f*9)/4;
  return {cal:Math.round(cal), p:Math.round(p), c:Math.round(c), f:Math.round(f)};
}
function render(){
  const t = getTargets();
  if(!profile){
    document.getElementById(\'app\').innerHTML = `
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="bg-white rounded-[32px] p-6 w-full max-w-md shadow-sm text-center">
        <h1 class="text-3xl font-black">مرحباً في رَشِيقْ</h1><p class="text-gray-500 text-sm mb-6">معالج الإعداد الأيضي</p>
        <div class="space-y-3 text-right">
          <div class="grid grid-cols-2 gap-2"><button onclick="setTmp(\'gender\',\'male\')" id="b-male" class="p-3 rounded-2xl font-bold bg-gray-900 text-white">ذكر</button><button onclick="setTmp(\'gender\',\'female\')" id="b-female" class="p-3 rounded-2xl font-bold bg-[#FFF9F0]">أنثى</button></div>
          <div class="grid grid-cols-3 gap-2">
            <div class="bg-[#FFF9F0] p-3 rounded-2xl text-center"><p class="text-xs">العمر</p><input id="age" type="number" value="25" class="w-full bg-transparent text-center font-black text-lg outline-none"></div>
            <div class="bg-[#FFF9F0] p-3 rounded-2xl text-center"><p class="text-xs">الطول</p><input id="height" type="number" value="175" class="w-full bg-transparent text-center font-black text-lg outline-none"></div>
            <div class="bg-[#FFF9F0] p-3 rounded-2xl text-center"><p class="text-xs">الوزن</p><input id="weight" type="number" value="75" class="w-full bg-transparent text-center font-black text-lg outline-none"></div>
          </div>
          <select id="activity" class="w-full bg-[#FFF9F0] p-3 rounded-2xl"><option value="1.2">خامل</option><option value="1.375">نشاط خفيف</option><option value="1.55" selected>نشاط متوسط</option><option value="1.725">نشط جداً</option></select>
          <select id="goal" class="w-full bg-[#FFF9F0] p-3 rounded-2xl"><option value="deficit">خسارة دهون</option><option value="maintenance" selected>تثبيت الوزن</option><option value="bulk">تضخيم</option></select>
          <button onclick="start()" class="w-full bg-emerald-500 text-white py-4 rounded-full font-bold text-lg">ابدأ رحلتك الآن →</button>
        </div>
      </div>
    </div>`;
    return;
  }
  let all = [...logs.meals.breakfast, ...logs.meals.lunch, ...logs.meals.dinner, ...logs.meals.snacks];
  let totals = all.reduce((a,b)=>({cal:a.cal+b.cal, p:a.p+b.p, c:a.c+b.c, f:a.f+b.f}),{cal:0,p:0,c:0,f:0});
  let perc = Math.min(totals.cal/t.cal*100,100);
  document.getElementById(\'app\').innerHTML = `
  <div class="bg-white/80 sticky top-0 border-b p-4 flex justify-between items-center max-w-[480px] mx-auto"><h1 class="font-black text-xl">رَشِيقْ <span class="text-emerald-500 text-xs">RASHIK</span></h1><span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full">● يعمل</span></div>
  <div class="max-w-[480px] mx-auto p-4 space-y-4 pb-20">
    <div class="bg-white p-5 rounded-[20px] shadow-sm flex items-center gap-5">
      <div class="relative w-28 h-28 shrink-0">
        <svg class="w-28 h-28 -rotate-90"><circle cx="56" cy="56" r="48" stroke="#FFF1E0" stroke-width="10" fill="none"/><circle cx="56" cy="56" r="48" stroke="#10B981" stroke-width="10" fill="none" stroke-dasharray="${2*Math.PI*48}" stroke-dashoffset="${2*Math.PI*48*(1-perc/100)}" stroke-linecap="round"/></svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center"><span class="text-2xl font-black">${totals.cal}</span><span class="text-xs text-gray-500">/ ${t.cal}</span></div>
      </div>
      <div class="flex-1 space-y-2 text-xs">
        <div>بروتين ${totals.p.toFixed(0)}/${t.p}g <div class="h-2 bg-gray-100 rounded-full"><div class="h-2 bg-sky-500 rounded-full" style="width:${Math.min(totals.p/t.p*100,100)}%"></div></div></div>
        <div>كارب ${totals.c.toFixed(0)}/${t.c}g <div class="h-2 bg-gray-100 rounded-full"><div class="h-2 bg-orange-400 rounded-full" style="width:${Math.min(totals.c/t.c*100,100)}%"></div></div></div>
        <div>دهون ${totals.f.toFixed(0)}/${t.f}g <div class="h-2 bg-gray-100 rounded-full"><div class="h-2 bg-rose-400 rounded-full" style="width:${Math.min(totals.f/t.f*100,100)}%"></div></div></div>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-sky-500 text-white p-4 rounded-[20px]"><p class="text-sm">المياه</p><p class="text-xl font-bold">${(logs.water/1000).toFixed(1)} / 2.5 لتر</p><button onclick="logs.water+=250;save()" class="mt-3 bg-white text-sky-600 rounded-full px-4 py-1 text-sm font-bold w-full">+ 250 مل</button></div>
      <div class="bg-orange-400 text-white p-4 rounded-[20px]"><p class="text-sm">الخطوات</p><p class="text-xl font-bold">${logs.steps} / 10000</p><button onclick="logs.steps+=500;save()" class="mt-3 bg-white text-orange-500 rounded-full px-4 py-1 text-sm font-bold w-full">+ 500 خطوة</button></div>
    </div>
    <div class="bg-white rounded-[20px] shadow-sm overflow-hidden">
      <div class="h-32 bg-gradient-to-br from-orange-100 to-emerald-50 flex items-end p-4"><h2 class="text-2xl font-black bg-white/80 px-4 py-2 rounded-2xl">${labels[activeMeal]}</h2></div>
      <div class="flex gap-2 p-3 overflow-x-auto">${Object.keys(labels).map(k=>`<button onclick="activeMeal=\'${k}\';render()" class="${activeMeal===k?\'bg-gray-900 text-white\':\'bg-[#FFF9F0]\'} px-5 py-2 rounded-full text-sm whitespace-nowrap font-bold">${labels[k]}</button>`).join(\'\')}</div>
      <div class="px-4 pb-4">
        <div class="flex justify-between items-center mb-3"><h3 class="font-bold">المكونات • ${logs.meals[activeMeal].length}</h3><button onclick="showAdd()" class="bg-emerald-500 text-white px-4 py-2 rounded-full text-sm font-bold">+ إضافة</button></div>
        <div class="space-y-2">${logs.meals[activeMeal].length===0?\'<p class="text-center text-gray-400 py-6">لا يوجد مكونات</p>\': logs.meals[activeMeal].map((f,i)=>`<div class="flex items-center gap-3 bg-[#FFF9F0] p-3 rounded-[20px]"><div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center">🍽️</div><div class="flex-1"><p class="font-bold text-sm">${f.name}</p><p class="text-xs text-gray-500">${f.cal} سعرة</p></div><button onclick="logs.meals[\'${activeMeal}\'].splice(${i},1);save()" class="text-rose-400">✕</button></div>`).join(\'\')}</div>
      </div>
    </div>
    <button onclick="localStorage.clear();location.reload()" class="w-full text-xs text-gray-400 py-4">إعادة تعيين</button>
  </div>
  <div id="modal" class="hidden fixed inset-0 bg-black/40 flex items-end justify-center z-50"><div class="bg-white w-full max-w-[480px] rounded-t-[32px] p-4 max-h-[70vh] overflow-auto"><input id="search" oninput="filterFoods()" placeholder="ابحث..." class="w-full bg-[#FFF9F0] rounded-full px-4 py-3 outline-none mb-3"><div id="foodList" class="space-y-2"></div><button onclick="hideAdd()" class="w-full mt-4 bg-gray-900 text-white py-3 rounded-full">إغلاق</button></div></div>
  `;
}
let tmpGender=\'male\';
function setTmp(k,v){ tmpGender=v; document.getElementById(\'b-male\').className=v===\'male\'?\'p-3 rounded-2xl font-bold bg-gray-900 text-white\':\'p-3 rounded-2xl font-bold bg-[#FFF9F0]\'; document.getElementById(\'b-female\').className=v===\'female\'?\'p-3 rounded-2xl font-bold bg-gray-900 text-white\':\'p-3 rounded-2xl font-bold bg-[#FFF9F0]\'; }
function start(){
  profile={gender:tmpGender, age:+document.getElementById(\'age\').value, height:+document.getElementById(\'height\').value, weight:+document.getElementById(\'weight\').value, activity:+document.getElementById(\'activity\').value, goal:document.getElementById(\'goal\').value};
  localStorage.setItem(\'rashik_profile\', JSON.stringify(profile)); render();
}
function showAdd(){
  document.getElementById(\'modal\').classList.remove(\'hidden\');
  filterFoods();
}
function hideAdd(){ document.getElementById(\'modal\').classList.add(\'hidden\'); }
function filterFoods(){
  const q=(document.getElementById(\'search\')?.value||\'\').trim();
  const list=document.getElementById(\'foodList\');
  const filtered=FOODS.filter(f=>f.name.includes(q));
  list.innerHTML=filtered.map(f=>`<button onclick=\'addFood(${JSON.stringify(f).replace(/\'/g,"&#39;")})\' class="w-full flex justify-between items-center p-3 bg-[#FFF9F0] rounded-2xl"><span class="font-bold">${f.name}</span><span class="text-xs bg-white px-3 py-1 rounded-full">${f.cal} سعرة</span></button>`).join(\'\');
}
function addFood(f){ logs.meals[activeMeal].push(f); save(); hideAdd(); }
render();
</script>
</body>
</html>
