<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RASHIK - رشيق</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:\'Tajawal\',sans-serif;background:#FFF9F0}</style>
</head>
<body>
<div id="app"></div>
<script>
const FOODS = [
  {name:"صدر دجاج",cal:165,p:31,c:0,f:3.6},
  {name:"ارز ابيض",cal:130,p:2.4,c:28,f:0.2},
  {name:"بيض",cal:143,p:12.5,c:1.1,f:9.5},
  {name:"شوفان",cal:389,p:16.9,c:66,f:6.9},
  {name:"تونة",cal:116,p:25.5,c:0,f:0.8},
  {name:"موز",cal:89,p:1.1,c:23,f:0.3}
];
let profile = JSON.parse(localStorage.getItem(\'rashik_profile\')||\'null\');
let logs = JSON.parse(localStorage.getItem(\'rashik_logs\')||\'{"water":0,"steps":0,"meals":{"breakfast":[],"lunch":[],"dinner":[],"snacks":[]}}\');
let activeMeal = \'breakfast\';
let tmpGender = \'male\';
const labels = {breakfast:\'الإفطار\', lunch:\'الغداء\', dinner:\'العشاء\', snacks:\'وجبات خفيفة\'};

function save(){ localStorage.setItem(\'rashik_logs\', JSON.stringify(logs)); render(); }
function getTargets(){
  if(!profile) return {cal:2200,p:150,c:250,f:70};
  let bmr = profile.gender===\'male\' ? 10*profile.weight+6.25*profile.height-5*profile.age+5 : 10*profile.weight+6.25*profile.height-5*profile.age-161;
  let tdee = bmr * profile.activity;
  let cal = profile.goal===\'deficit\'? tdee*0.8 : profile.goal===\'bulk\'? tdee*1.12 : tdee;
  let p = profile.weight * 2;
  let f = (cal*0.25)/9;
  let c = (cal - p*4 - f*9)/4;
  return {cal:Math.round(cal), p:Math.round(p), c:Math.round(c), f:Math.round(f)};
}
function render(){
  const t = getTargets();
  if(!profile){
    document.getElementById(\'app\').innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px">
      <div style="background:white;border-radius:32px;padding:24px;width:100%;max-width:400px;text-align:center">
        <h1 style="font-size:28px;font-weight:900">مرحبا في رشيق</h1>
        <p style="color:gray;font-size:13px;margin-bottom:16px">معالج الاعداد الايضي</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
          <button onclick="setGender(\'male\')" id="b-male" style="padding:12px;border-radius:16px;font-weight:bold;background:#111;color:white">ذكر</button>
          <button onclick="setGender(\'female\')" id="b-female" style="padding:12px;border-radius:16px;font-weight:bold;background:#FFF9F0">انثى</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
          <div style="background:#FFF9F0;padding:10px;border-radius:16px"><div style="font-size:11px">العمر</div><input id="age" type="number" value="25" style="width:100%;text-align:center;font-weight:900;background:transparent;outline:none"></div>
          <div style="background:#FFF9F0;padding:10px;border-radius:16px"><div style="font-size:11px">الطول</div><input id="height" type="number" value="175" style="width:100%;text-align:center;font-weight:900;background:transparent;outline:none"></div>
          <div style="background:#FFF9F0;padding:10px;border-radius:16px"><div style="font-size:11px">الوزن</div><input id="weight" type="number" value="75" style="width:100%;text-align:center;font-weight:900;background:transparent;outline:none"></div>
        </div>
        <select id="activity" style="width:100%;background:#FFF9F0;padding:12px;border-radius:16px;margin-bottom:8px"><option value="1.2">خامل</option><option value="1.375">نشاط خفيف</option><option value="1.55" selected>نشاط متوسط</option><option value="1.725">نشط جدا</option></select>
        <select id="goal" style="width:100%;background:#FFF9F0;padding:12px;border-radius:16px;margin-bottom:12px"><option value="deficit">خسارة دهون</option><option value="maintenance" selected>تثبيت الوزن</option><option value="bulk">تضخيم</option></select>
        <button onclick="start()" style="width:100%;background:#10B981;color:white;padding:16px;border-radius:999px;font-weight:bold;font-size:18px">ابدأ رحلتك الآن</button>
      </div>
    </div>`;
    return;
  }
  let all = [...logs.meals.breakfast, ...logs.meals.lunch, ...logs.meals.dinner, ...logs.meals.snacks];
  let totals = all.reduce((a,b)=>({cal:a.cal+b.cal, p:a.p+b.p, c:a.c+b.c, f:a.f+b.f}),{cal:0,p:0,c:0,f:0});
  let perc = Math.min(totals.cal/t.cal*100,100);
  let mealsHtml = logs.meals[activeMeal].length===0 ? \'<p style="text-align:center;color:#aaa;padding:20px">لا يوجد مكونات</p>\' : logs.meals[activeMeal].map((f,i)=> `<div style="display:flex;align-items:center;gap:12px;background:#FFF9F0;padding:12px;border-radius:20px;margin-bottom:8px"><div style="width:40px;height:40px;background:white;border-radius:12px;display:flex;align-items:center;justify-content:center">🍽️</div><div style="flex:1;text-align:right"><div style="font-weight:bold;font-size:14px">${f.name}</div><div style="font-size:12px;color:gray">${f.cal} سعرة</div></div><button onclick="removeFood(${i})" style="color:#fb7185">✕</button></div>`).join(\'\');
  let tabs = Object.keys(labels).map(k=> `<button onclick="activeMeal=\'${k}\';render()" style="padding:8px 18px;border-radius:999px;font-size:13px;font-weight:bold;white-space:nowrap;${activeMeal===k?\'background:#111;color:white\':\'background:#FFF9F0\'}">${labels[k]}</button>`).join(\'\');
  document.getElementById(\'app\').innerHTML = `
  <div style="background:white;padding:16px;display:flex;justify-content:space-between;align-items:center;max-width:480px;margin:auto;border-bottom:1px solid #eee"><b>رشيق RASHIK</b><span style="font-size:11px;background:#dcfce7;color:#15803d;padding:4px 10px;border-radius:999px">● يعمل</span></div>
  <div style="max-width:480px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:16px;padding-bottom:80px">
    <div style="background:white;padding:20px;border-radius:20px;display:flex;align-items:center;gap:20px">
      <div style="position:relative;width:112px;height:112px;flex-shrink:0">
        <svg width="112" height="112" style="transform:rotate(-90deg)"><circle cx="56" cy="56" r="48" stroke="#FFF1E0" stroke-width="10" fill="none"/><circle cx="56" cy="56" r="48" stroke="#10B981" stroke-width="10" fill="none" stroke-dasharray="${2*Math.PI*48}" stroke-dashoffset="${2*Math.PI*48*(1-perc/100)}" stroke-linecap="round"/></svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-size:22px;font-weight:900">${totals.cal}</span><span style="font-size:11px;color:gray">/ ${t.cal}</span></div>
      </div>
      <div style="flex:1;font-size:12px;display:flex;flex-direction:column;gap:8px">
        <div>بروتين ${totals.p.toFixed(0)}/${t.p}g <div style="height:8px;background:#f3f4f6;border-radius:999px"><div style="height:8px;background:#0ea5e9;border-radius:999px;width:${Math.min(totals.p/t.p*100,100)}%"></div></div></div>
        <div>كارب ${totals.c.toFixed(0)}/${t.c}g <div style="height:8px;background:#f3f4f6;border-radius:999px"><div style="height:8px;background:#f97316;border-radius:999px;width:${Math.min(totals.c/t.c*100,100)}%"></div></div></div>
        <div>دهون ${totals.f.toFixed(0)}/${t.f}g <div style="height:8px;background:#f3f4f6;border-radius:999px"><div style="height:8px;background:#ec4899;border-radius:999px;width:${Math.min(totals.f/t.f*100,100)}%"></div></div></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div style="background:#0ea5e9;color:white;padding:16px;border-radius:20px"><div style="font-size:13px">المياه</div><div style="font-size:18px;font-weight:bold">${(logs.water/1000).toFixed(1)} / 2.5 لتر</div><button onclick="logs.water+=250;save()" style="margin-top:10px;background:white;color:#0ea5e9;width:100%;padding:6px;border-radius:999px;font-weight:bold">+ 250 مل</button></div>
      <div style="background:#f97316;color:white;padding:16px;border-radius:20px"><div style="font-size:13px">الخطوات</div><div style="font-size:18px;font-weight:bold">${logs.steps} / 10000</div><button onclick="logs.steps+=500;save()" style="margin-top:10px;background:white;color:#f97316;width:100%;padding:6px;border-radius:999px;font-weight:bold">+ 500 خطوة</button></div>
    </div>
    <div style="background:white;border-radius:20px;overflow:hidden">
      <div style="height:100px;background:linear-gradient(to bottom right,#ffedd5,#ecfdf5);display:flex;align-items:end;padding:16px"><h2 style="font-size:22px;font-weight:900;background:rgba(255,255,255,0.8);padding:6px 14px;border-radius:16px">${labels[activeMeal]}</h2></div>
      <div style="display:flex;gap:8px;padding:12px;overflow:auto">${tabs}</div>
      <div style="padding:0 16px 16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>المكونات • ${logs.meals[activeMeal].length}</b><button onclick="showAdd()" style="background:#10B981;color:white;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:bold">+ إضافة</button></div>${mealsHtml}</div>
    </div>
    <button onclick="localStorage.clear();location.reload()" style="width:100%;font-size:11px;color:#aaa;padding:10px">إعادة تعيين</button>
  </div>
  <div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);align-items:end;justify-content:center;z-index:50"><div style="background:white;width:100%;max-width:480px;border-radius:32px 32px 0 0;padding:16px;max-height:70vh;overflow:auto"><input id="search" oninput="filterFoods()" placeholder="ابحث..." style="width:100%;background:#FFF9F0;border-radius:999px;padding:12px 16px;outline:none;margin-bottom:12px"><div id="foodList" style="display:flex;flex-direction:column;gap:8px"></div><button onclick="hideAdd()" style="width:100%;margin-top:16px;background:#111;color:white;padding:12px;border-radius:999px">إغلاق</button></div></div>
  `;
}
function setGender(v){ tmpGender=v; document.getElementById(\'b-male\').style.background=v===\'male\'?\'#111\':\'#FFF9F0\'; document.getElementById(\'b-male\').style.color=v===\'male\'?\'white\':\'black\'; document.getElementById(\'b-female\').style.background=v===\'female\'?\'#111\':\'#FFF9F0\'; document.getElementById(\'b-female\').style.color=v===\'female\'?\'white\':\'black\'; }
function start(){
  profile={gender:tmpGender, age:+document.getElementById(\'age\').value, height:+document.getElementById(\'height\').value, weight:+document.getElementById(\'weight\').value, activity:+document.getElementById(\'activity\').value, goal:document.getElementById(\'goal\').value};
  localStorage.setItem(\'rashik_profile\', JSON.stringify(profile)); render();
}
function showAdd(){ document.getElementById(\'modal\').style.display=\'flex\'; filterFoods(); }
function hideAdd(){ document.getElementById(\'modal\').style.display=\'none\'; }
function filterFoods(){
  const q=(document.getElementById(\'search\')?.value||\'\').trim();
  const list=document.getElementById(\'foodList\');
  const filtered=FOODS.filter(f=>f.name.includes(q));
  list.innerHTML=filtered.map((f,i)=> `<button onclick="addFood(${FOODS.indexOf(f)})" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px;background:#FFF9F0;border-radius:16px"><span style="font-weight:bold">${f.name}</span><span style="font-size:12px;background:white;padding:4px 10px;border-radius:999px">${f.cal} سعرة</span></button>`).join(\'\');
}
function addFood(idx){ logs.meals[activeMeal].push(FOODS[idx]); save(); hideAdd(); }
function removeFood(i){ logs.meals[activeMeal].splice(i,1); save(); }
render();
</script>
</body>
</html>
